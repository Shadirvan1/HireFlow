name: HireFlow Auto-Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        env:
          SECRET_KEY: "temporary-key-for-testing"
          DEBUG: "True"
          # These lines fix the 'NoneType' concatenation error
          DB_NAME: "test_db"
          DB_ENGINE: "django.db.backends.sqlite3"
          REDIS_HOST: "localhost"
        run: |
          cd backend
          python manage.py test 

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Backend
        run: |
          docker build -t 277436022464.dkr.ecr.ap-south-1.amazonaws.com/hireflow-backend:latest ./backend
          docker push 277436022464.dkr.ecr.ap-south-1.amazonaws.com/hireflow-backend:latest

      - name: Build & Push AI Service
        run: |
          docker build -t 277436022464.dkr.ecr.ap-south-1.amazonaws.com/hireflow-ai-service:latest ./ai_service
          docker push 277436022464.dkr.ecr.ap-south-1.amazonaws.com/hireflow-ai-service:latest

      - name: Update EKS Cluster
        run: |
          aws eks update-kubeconfig --name hireflow-cluster --region ap-south-1
          kubectl rollout restart deployment/backend-deployment
          kubectl rollout restart deployment/ai-service-deployment
          kubectl apply -f k8s/config.yaml