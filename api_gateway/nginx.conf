events {}

http {
    # Essential for WebSocket stability
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    server {
        listen 80;
        server_name localhost;

        # =========================
        # 1. Django REST Framework APIs
        # =========================
        # This handles your /api/v1/ accounts, login, etc.
        location /api/v1/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # 2. Django Channels WebSockets
        # =========================
        # This handles your ws:// chat connections
        location /ws/ {
            proxy_pass http://backend:8000;

            # WebSocket Specific Headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time streams
            proxy_buffering off;
        }

        # =========================
        # 3. AI Service (FastAPI)
        # =========================
        location /api/ai/ {
            rewrite ^/api/ai/(.*)$ /$1 break;
            proxy_pass http://ai_service:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}