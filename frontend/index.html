<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Title (VERY IMPORTANT) -->
    <title>Hire-Flow | Find Jobs & Hire Talent Easily</title>

    <!-- SEO Meta -->
    <meta name="description" content="Hire-Flow is a modern job search and hiring platform. Find your dream job or hire top talent quickly with smart matching and seamless applications." />
    <meta name="keywords" content="jobs, hiring platform, job search, careers, employment, hire talent, remote jobs, fresher jobs, software jobs, India jobs, hire-flow" />
    <meta name="author" content="Hire-Flow Team" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://hire-flow.online/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dj046s16s/image/upload/v1774356340/Gemini_Generated_Image_9ludpl9ludpl9lud_pgn2hg.png" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="Hire-Flow | Find Jobs & Hire Talent Easily" />
    <meta property="og:description" content="Discover jobs, apply easily, and hire the best candidates with Hire-Flow." />
    <meta property="og:image" content="https://res.cloudinary.com/dj046s16s/image/upload/v1774356340/Gemini_Generated_Image_9ludpl9ludpl9lud_pgn2hg.png" />
    <meta property="og:url" content="https://hire-flow.online/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hire-Flow | Job Search & Hiring Platform" />
    <meta name="twitter:description" content="Find jobs or hire talent effortlessly with Hire-Flow." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dj046s16s/image/upload/v1774356340/Gemini_Generated_Image_9ludpl9ludpl9lud_pgn2hg.png" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Hire-Flow",
      "url": "https://hire-flow.online",
      "description": "A job search and hiring platform to connect candidates with employers.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hire-flow.online/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
