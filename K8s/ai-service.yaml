apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: fastapi
        image: 277436022464.dkr.ecr.ap-south-1.amazonaws.com/hireflow-ai-service:latest
        command: ["uvicorn", "app_main.main:app", "--host", "0.0.0.0", "--port", "8002"]
        envFrom:
          - configMapRef:
              name: hireflow-config
          - secretRef:      
              name: ai-secrets 
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 8002