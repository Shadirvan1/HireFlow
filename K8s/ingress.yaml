apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hireflow-combined-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # SSL/TLS Configuration
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:277436022464:certificate/667f8eef-abf7-4352-afdf-cbbaab1c1fee
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'

    # Health Check — FIXED: dedicated endpoint + only accept 200
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health/
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP        # ALB talks directly to pod over HTTP (bypasses SSL redirect)
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200'              # FIXED: was '200,404,301,302'

    # WebSocket support
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600

spec:
  ingressClassName: alb
  rules:
    - host: api.hire-flow.online
      http:
        paths:
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

          - path: /static/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

          - path: /api/ai/
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8002